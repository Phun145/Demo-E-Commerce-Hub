<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .message-success { color: green; font-weight: bold; }
        .error-msg { color: red; font-size: 0.9em; margin-left: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 30px; max-width: 800px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 6px; box-sizing: border-box; }
        .buttons { margin-top: 20px; }
    </style>
</head>
<body>
<h1>Add New Artifact</h1>
<hr>

<p th:if="${successMessage != null}" class="message-success" th:text="${successMessage}"></p>

<form th:action="@{/add}" method="post" th:object="${artifact}">
    <div class="form-grid">
        <div class="form-group">
            <label for="artifactCode">Device Code:</label>
            <input type="text" id="artifactCode" th:field="*{artifactCode}">
            <span class="error-msg" th:if="${#fields.hasErrors('artifactCode')}" th:errors="*{artifactCode}"></span>
        </div>

        <div class="form-group">
            <label for="cateId">Category:</label>
            <select id="cateId" th:field="*{cateId}">
                <option value="">-- Select Category --</option>
                <option th:each="cate : ${cateList}"
                        th:value="${cate.id}"
                        th:text="${cate.categoryName}">
                </option>
            </select>
            <span class="error-msg" th:if="${#fields.hasErrors('cateId')}" th:errors="*{cateId}"></span>
        </div>

        <div class="form-group">
            <label for="artifactName">Artifact Name:</label>
            <input type="text" id="artifactName" th:field="*{artifactName}">
            <span class="error-msg" th:if="${#fields.hasErrors('artifactName')}" th:errors="*{artifactName}"></span>
        </div>

        <div class="form-group">
            <label for="estimatedValue">Estimated Value ($):</label>
            <input type="text" id="estimatedValue" th:field="*{estimatedValue}">
            <span class="error-msg" th:if="${#fields.hasErrors('estimatedValue')}" th:errors="*{estimatedValue}"></span>
        </div>

        <div class="form-group">
            <label for="ageYears">Age (years):</label>
            <input type="text" id="ageYears" th:field="*{ageYears}">
            <span class="error-msg" th:if="${#fields.hasErrors('ageYears')}" th:errors="*{ageYears}"></span>
        </div>

        <div class="form-group">
            <label for="acquisitionDate">Acquisition Date (dd/MM/yyyy):</label>
            <input type="date" id="acquisitionDate" th:field="*{acquisitionDate}">
            <span class="error-msg" th:if="${#fields.hasErrors('acquisitionDate')}" th:errors="*{acquisitionDate}"></span>
        </div>

        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" th:field="*{status}">
                <option th:each="option : ${statusList}"
                        th:value="${option.status()}"
                        th:text="${option.status()} + '-' + ${option.statusDes()}">
                </option>
            </select>
            <span class="error-msg" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
        </div>
    </div>

    <div class="buttons">
        <button type="submit">Save</button>
        <a th:href="@{/}">
            <button type="button">Back</button>
        </a>
    </div>
</form>
</body>
</html>
