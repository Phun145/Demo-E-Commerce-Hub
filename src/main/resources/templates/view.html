<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 40px; max-width: 700px; margin-top: 20px; }
        .detail-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .detail-label { font-weight: bold; }
        .buttons { margin-top: 30px; }
    </style>
</head>
<body>
<h1>View Artifact Details</h1>
<hr>

<div class="details-grid" th:if="${artifact != null}">
    <div class="detail-item">
        <span class="detail-label">Artifact Code:</span>
        <span th:text="${artifact.artifactCode}"></span>
    </div>

    <div class="detail-item">
        <span class="detail-label">Category:</span>
        <span th:text="${artifact.category != null ? artifact.category.categoryName : ''}"></span>
    </div>

    <div class="detail-item">
        <span class="detail-label">Artifact Name:</span>
        <span th:text="${artifact.artifactName}"></span>
    </div>

    <div class="detail-item">
        <span class="detail-label">Estimated Value ($):</span>
        <span th:text="${artifact.estimatedValue}"></span>
    </div>

    <div class="detail-item">
        <span class="detail-label">Age (years):</span>
        <span th:text="${artifact.ageYears}"></span>
    </div>

    <div class="detail-item">
        <span class="detail-label">Acquisition Date:</span>
        <span th:text="${artifact.acquisitionDate != null ? #temporals.format(artifact.acquisitionDate, 'dd/MM/yyyy') : ''}"></span>
    </div>

    <div class="detail-item">
        <span class="detail-label">Status:</span>
        <span th:text="${artifact.statusDes}"></span>
    </div>
</div>

<div class="buttons">
    <a th:href="@{/}">
        <button type="button">Back</button>
    </a>
</div>
</body>
</html>
